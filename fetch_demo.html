<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>List of Products</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
            font-size: 32px;
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            border: 1px solid #999;
        }

        th,
        td {
            border: 1px solid #999;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
            color: #333;
            font-weight: bold;
        }

        td {
            height: 70px;
            font-size: 15px;
        }

        .serial {
            width: 7%;
        }

        .title {
            width: 30%;
            text-align: left;
            padding-left: 20px;
        }

        .image {
            width: 12%;
        }

        .category {
            width: 17%;
        }

        .rating {
            width: 10%;
        }

        .price {
            width: 12%;
        }

        .stock {
            width: 12%;
        }

        .product-img {
            width: 45px;
            height: 55px;
            object-fit: contain;
        }

        tbody tr:hover {
            background-color: #f8f8f8;
        }
    </style>

    <script>
        const URL = "https://dummyjson.com/products?limit=10&skip=6";

        async function loadProducts() {
            try {
                const res = await fetch(URL);

                console.log("res =", res);

                const data = await res.json();

                console.log("data =", data.products);

                let rows = "";

                data.products.forEach((i, index) => {
                    rows += `
                        <tr>
                            <td class="serial">${index + 1}</td>

                            <td class="title">
                                ${i.title}
                            </td>

                            <td class="image">
                                <img
                                    src="${i.thumbnail}"
                                    alt="${i.title}"
                                    class="product-img"
                                >
                            </td>

                            <td class="category">
                                ${i.category}
                            </td>

                            <td class="rating">
                                ${i.rating}
                            </td>

                            <td class="price">
                                ${i.price}
                            </td>

                            <td class="stock">
                                ${i.stock}
                            </td>
                        </tr>
                    `;
                });

                document.querySelector("table tbody").innerHTML = rows;
            }

            catch (err) {
                console.log("Error:", err);
            }
        }

        loadProducts();
    </script>
</head>

<body>

    <h1>List of Products</h1>

    <table>
        <thead>
            <tr>
                <th class="serial">Sr.No.</th>
                <th class="title">Title</th>
                <th class="image">Image</th>
                <th class="category">Category</th>
                <th class="rating">Rating</th>
                <th class="price">Price($)</th>
                <th class="stock">Stock</th>
            </tr>
        </thead>

        <tbody>
            <!-- Products will come here -->
        </tbody>
    </table>

</body>
</html>
